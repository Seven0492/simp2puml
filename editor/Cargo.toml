[package]
name = "puml-editor"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Éditeur PlantUML GPUI (MVVM) avec aperçu vectoriel en direct rendu par pumlrender (Nim)"
publish = false

[[bin]]
name = "puml-editor"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
# lecture du SVG de l'aperçu vectoriel (déjà utilisé par gpui, même version)
roxmltree = "0.20"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
