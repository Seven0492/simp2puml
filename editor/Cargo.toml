[package]
name = "puml-editor"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "simp2puml : éditeur PlantUML GPUI (MVVM) avec aperçu vectoriel en direct rendu par pumlrender (Nim)"
publish = false

[[bin]]
name = "puml-editor"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
# lecture du SVG de l'aperçu vectoriel (déjà utilisé par gpui, même version)
roxmltree = "0.20"

[dev-dependencies]
# plateforme de test sans fenêtre : parcours réels de l'interface (clics, raccourcis)
gpui = { version = "0.2.2", features = ["test-support"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
